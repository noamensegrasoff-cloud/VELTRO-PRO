<html lang="ar" dir="rtl">

    <link rel="icon" href="/VELTRO-PRO/icons/veltro.svg" type="image/svg+xml" />

    <script type="module" src="/src/main.jsx"></script>

      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/VELTRO-PRO/sw.js', { scope: '/VELTRO-PRO/' }).catch((error) => {
            console.error('VELTRO-PRO service worker registration failed:', error);
          });
        });
      }
