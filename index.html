<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#17365c" />
    <meta name="description" content="VELTRO-PRO — نظام إدارة المتجر والمبيعات والمخزون." />
    <link rel="manifest" href="/VELTRO-PRO/manifest.webmanifest" />
    <link rel="icon" href="/VELTRO-PRO/icons/veltro.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/VELTRO-PRO/icons/veltro.svg" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <title>VELTRO-PRO — Business Suite</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      // Disable and remove stale service-worker/PWA caches so every device loads the deployed app.
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', async () => {
          try {
            const registrations = await navigator.serviceWorker.getRegistrations();
            await Promise.all(registrations.map((registration) => registration.unregister()));
            if ('caches' in window) {
              const keys = await caches.keys();
              await Promise.all(keys.filter((key) => key.startsWith('veltro-pro-shell-')).map((key) => caches.delete(key)));
            }
          } catch (error) {
            console.warn('Could not clear old VELTRO-PRO app cache:', error);
          }
        }, { once: true });
      }
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
