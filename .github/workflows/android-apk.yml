name: Build VELTRO-PRO Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'src/**'
      - 'public/**'
      - 'index.html'
      - 'package.json'
      - 'capacitor.config.ts'
      - '.github/workflows/android-apk.yml'
    branches: [main]

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - name: Install Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - name: Install dependencies
        run: npm install
      - name: Build web app
        env:
          CAPACITOR_BUILD: 'true'
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL || secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY || secrets.VITE_SUPABASE_ANON_KEY }}
        run: npm run build
      - name: Install PNG generation tool
        run: npm install --no-save sharp
      - name: Prepare Android app icon from VELTRO brand mark
        run: |
          mkdir -p resources
          node --input-type=module <<'NODE'
          import sharp from 'sharp';
          import { readFile } from 'node:fs/promises';
          const svg = await readFile('public/icons/veltro.svg');
          await sharp(svg).resize(1024, 1024, { fit: 'contain' }).png().toFile('resources/icon.png');
          await sharp({ create: { width: 2732, height: 2732, channels: 3, background: '#07162f' } }).png().toFile('resources/splash.png');
          NODE
      - name: Generate native Android project and branded assets
        run: |
          npx cap add android
          npx capacitor-assets generate --android
          python3 - <<'PY'
          from pathlib import Path
          p = Path('android/app/src/main/AndroidManifest.xml')
          s = p.read_text()
          intent = '''
                  <intent-filter>
                      <action android:name="android.intent.action.VIEW" />
                      <category android:name="android.intent.category.DEFAULT" />
                      <category android:name="android.intent.category.BROWSABLE" />
                      <data android:scheme="com.veltro.pro" android:host="auth" android:path="/callback" />
                  </intent-filter>'''
          if 'android:scheme="com.veltro.pro"' not in s:
              s = s.replace('</activity>', intent + '\\n        </activity>', 1)
              p.write_text(s)
          PY
          python3 - <<'PY'
          from pathlib import Path
          p = Path('android/app/src/main/java/com/veltro/pro/MainActivity.java')
          s = p.read_text()
          if 'hideSystemBars' not in s:
              s = s.replace(
                  'public class MainActivity extends BridgeActivity {',
                  '''public class MainActivity extends BridgeActivity {
              private void hideSystemBars() {
                  getWindow().getDecorView().setSystemUiVisibility(
                      android.view.View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY
                      | android.view.View.SYSTEM_UI_FLAG_FULLSCREEN
                      | android.view.View.SYSTEM_UI_FLAG_HIDE_NAVIGATION
                      | android.view.View.SYSTEM_UI_FLAG_LAYOUT_FULLSCREEN
                      | android.view.View.SYSTEM_UI_FLAG_LAYOUT_HIDE_NAVIGATION
                      | android.view.View.SYSTEM_UI_FLAG_LAYOUT_STABLE
                  );
              }

              @Override
              public void onWindowFocusChanged(boolean hasFocus) {
                  super.onWindowFocusChanged(hasFocus);
                  if (hasFocus) hideSystemBars();
              }

              @Override
              public void onCreate(android.os.Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  hideSystemBars();
              }'''
              )
              p.write_text(s)
          PY
          npx cap sync android
      - name: Build installable Android APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VELTRO-PRO-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish direct APK download
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "android-build-${{ github.run_number }}" android/app/build/outputs/apk/debug/app-debug.apk
          --title "VELTRO-PRO Android ${{ github.run_number }}"
          --notes "Installable VELTRO-PRO Android APK build."
          --latest
